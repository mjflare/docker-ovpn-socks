version: '3.8'

services:
  openvpn-proxy:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: openvpn-proxy
    image: openvpn-proxy:latest
    
    # Restart policy
    restart: unless-stopped
    
    # Environment variables
    env_file:
      - .env
    
    # Volumes
    volumes:
      - ${OVPN_DIR}:/opt/ovpn:ro
    
    # Ports
    ports:
      - "${PROXY_PORT}:8888"
    
    # Capabilities for VPN
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    
    # Network mode
    networks:
      - default
    
    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    # Resource limits (optional)
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    
    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  default:
    driver: bridge
